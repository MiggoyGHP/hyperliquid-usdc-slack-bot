name: Hyperliquid USDC utilization

on:
  schedule:
    # Poll every 10 minutes, deliberately off the top of the hour: GitHub's
    # scheduled-workflow queue is most congested at :00 and delays there are
    # worst. Six attempts an hour are six independent chances to beat the
    # queue, which cuts worst-case crossing latency from ~60 min to ~10-20.
    #
    # This does NOT increase Slack volume. Cadence is driven by the timestamp
    # in state.json (see decide.py), never by run count, so five of every six
    # runs return SUPPRESSED, post nothing and commit nothing. Raising the
    # poll rate and raising the post rate are different knobs - the post rate
    # is HEARTBEAT_HOURS in the env block below.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

# Needed to commit state.json back to the repo. That commit is also what keeps
# the schedule alive: GitHub disables cron on repos with no commits for 60 days.
permissions:
  contents: write

# Never let a delayed run overlap a new one; state.json has no locking.
concurrency:
  group: hl-usdc-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          # Resolve the branch at run time rather than defaulting to the SHA
          # the scheduled event was created from. A delayed run must not read
          # a state.json that a newer run has already superseded: stale state
          # means a stale last_band, which re-fires a crossing alert that has
          # already been sent.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install runtime dependencies
        run: pip install --disable-pip-version-check -r deploy/requirements-vm.txt

      - name: Run one tick
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATE_FILE: state.json
          HEARTBEAT_HOURS: "1"
          ESCALATED_INTERVAL_HOURS: "1"
          ESCALATE_AT: "0.79"
          DISPLAY_TIMEZONE: Asia/Manila
          TOKEN_INDEX: "0"
        run: python -m hl_usdc_bot.tick_once

      - name: Persist state
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain state.json)" ]]; then
            echo "State unchanged (tick was suppressed); nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: record tick $(date -u +'%Y-%m-%dT%H:%MZ')"
          # A delayed run may have pushed first; rebase rather than fail.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, rebasing (attempt $attempt)"
            git pull --rebase --autostash
          done
          echo "Could not push state after 3 attempts" >&2
          exit 1
