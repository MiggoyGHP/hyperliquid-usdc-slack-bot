# Non-secret settings for the Cloud Run job. Passed with --env-vars-file rather
# than --set-env-vars so that any value containing a comma stays intact --
# --set-env-vars splits on commas.
#
# The webhook is NOT here. It arrives from Secret Manager; see setup.ps1.
# Every value must be quoted -- gcloud rejects a non-string.

DRY_RUN: "0"

# Cadence. Zero, not one, and the reason is subtle enough to be worth stating.
#
# decide.py suppresses a tick when `now - last_post_ts < interval`, and
# runner.py records last_post_ts at tick *start*. With an hourly cron the two
# fire almost exactly an hour apart, so scheduler jitter of a second or two
# decides whether the delta clears 1h -- and roughly every other hour it does
# not. The bot would post every two hours, unpredictably.
#
# Zero makes the interval check always pass, so cadence becomes exactly the
# cron: one post per hour, deterministically. The guard is not lost, it has
# moved to Cloud Scheduler, which is punctual in a way GitHub's queue was not.
#
# If the cron is ever made faster than the intended post rate, put the real
# number back here -- that is what the guard is for.
HEARTBEAT_HOURS: "0"
ESCALATED_INTERVAL_HOURS: "0"

ESCALATE_AT: "0.79"
TOKEN_INDEX: "0"

DISPLAY_TIMEZONE: "Asia/Manila"
DISPLAY_UTC_OFFSET_HOURS: "8"

# State lives in GCS because Cloud Run's filesystem is ephemeral. build_store()
# falls back to a local file when STATE_BUCKET is empty, and that fallback is
# silent -- every tick would read no state, decide FIRST_RUN and post. If this
# key ever goes missing the symptom is a channel full of duplicates.
#
# STATE_FILE is deliberately absent: STATE_BUCKET wins in build_store(), so
# setting it here would only mislead whoever reads this next.
STATE_BUCKET: "plucky-vision-508102-k7-hl-usdc-state"
STATE_OBJECT: "state.json"
